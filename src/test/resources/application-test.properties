spring.application.name=market-test

# ===================================================================
# POSTGRESQL DE PRUEBAS (Apunta a una BD diferente)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/market_test
spring.datasource.username=usuario
spring.datasource.password=secreto
spring.datasource.driver-class-name=org.postgresql.Driver

# 'create-drop' crea las tablas al iniciar el test y las destruye al finalizar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===================================================================
# MONGODB DE PRUEBAS (Apunta a una BD diferente)
# ===================================================================
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=market_nosql_test
