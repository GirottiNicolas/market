spring.application.name=market
# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=8080

# ===================================================================
# CONFIGURACIÓN DE POSTGRESQL (Spring Data JPA)
# ===================================================================
# Reemplaza los valores por tus credenciales de base de datos locales
spring.datasource.url=jdbc:postgresql://localhost:5432/TU_BASE_DE_DATOS
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_CONTRASEÑA
spring.datasource.driver-class-name=org.postgresql.Driver

# Estrategia de base de datos: 'update' crea o actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL reales ejecutadas por Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACIÓN DE MONGODB (Formato Moderno / No Deprecado)
# ===================================================================
# Se elimina el prefijo antiguo 'spring.data.mongodb' por el estándar actual
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=TU_BASE_DE_DATOS_NOSQL

# OPCIONAL (Alternativa moderna recomendada por MongoDB usando URI):
# Si prefieres usar una sola línea limpia de conexión en lugar de host/port külön
# spring.mongodb.uri=mongodb://TU_USUARIO:TU_CONTRASEÑA@localhost:27017/TU_BASE_DE_DATOS_NOSQL
