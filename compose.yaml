services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-market
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: secreto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mongo-db:
    image: mongo:latest
    container_name: mongo-market
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
